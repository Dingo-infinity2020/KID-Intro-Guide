name: Bootstrap KID guide

on:
  push:
    branches: [main]
    paths:
      - '.seed/**'
      - '.github/workflows/bootstrap-kid-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/v0.1 docs/v0.2
          cat .seed/v01_md.part* | base64 -d | gzip -d > "docs/v0.1/KID入门讲义_v0.1.md"
          cat .seed/v01_tex.part* | base64 -d | gzip -d > "docs/v0.1/KID入门讲义_v0.1.tex"
          cat .seed/v02_md.part* | base64 -d | gzip -d > "docs/v0.2/KID入门讲义_v0.2.md"
          cat .seed/v02_tex.part* | base64 -d | gzip -d > "docs/v0.2/KID入门讲义_v0.2.tex"

      - name: Compile PDFs with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.1
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.1.tex"
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.1.tex"
            cd ../v0.2
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.2.tex"
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.2.tex"

      - name: Commit restored sources and PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .seed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Import KID guide v0.1 and v0.2"
            git push
          fi
