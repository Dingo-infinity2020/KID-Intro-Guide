name: Publish KID guide v0.5

on:
  push:
    branches: [v0.5-publish]
    paths:
      - '.github/workflows/publish-v0.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed v0.5 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/v0.5/examples
          cp 'docs/v0.4/KID入门讲义_v0.4.tex' 'docs/v0.5/KID入门讲义_v0.5.tex'
          cp 'docs/v0.4/KID入门讲义_v0.4.md' 'docs/v0.5/KID入门讲义_v0.5.md'
          base64 -d bootstrap/v0.5/tex.patch.gz.b64 | gzip -dc > /tmp/tex.patch
          base64 -d bootstrap/v0.5/md.patch.gz.b64 | gzip -dc > /tmp/md.patch
          patch 'docs/v0.5/KID入门讲义_v0.5.tex' < /tmp/tex.patch
          patch 'docs/v0.5/KID入门讲义_v0.5.md' < /tmp/md.patch
          echo '56eda1bb20a6d7a3c790c76ae48328c9d2c6940b30e19bbf8a48f930404e188e  docs/v0.5/KID入门讲义_v0.5.tex' | sha256sum -c -
          echo '3cb748e25f75f1d70817700df2903ea18e702f5eeb35f5c03f6ca8dc15f167b5  docs/v0.5/KID入门讲义_v0.5.md' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path

          vdir = Path('docs/v0.5')
          (vdir/'README.md').write_text('''# KID 入门讲义 v0.5

主题：**微波谐振器与 IQ 读出：从 Q 到可拟合的 S21**。

本版本完整继承 v0.4，并新增：
- `Qi/Qc/Qr` 的能量与损耗率定义；
- linewidth 与 ring-down 的统一推导；
- ideal hanger/notch `S21`；
- IQ circle 的解析圆方程；
- fixed-tone readout 与 frequency/dissipation quadrature；
- cable delay、complex gain、asymmetry 与实际 resonance fitting；
- 两个可运行 Python 示例。

正式文件：
- `KID入门讲义_v0.5.pdf`
- `KID入门讲义_v0.5.tex`
- `KID入门讲义_v0.5.md`
- `CHANGELOG.md`
- `examples/`

编译：XeLaTeX 两次。
''')
          (vdir/'CHANGELOG.md').write_text('''# v0.5 Changelog — 2026-09-07

## 新增
- 新增“微波谐振器与 IQ 读出”完整章节。
- 从 `Q = ω0 U / Ploss` 推导 `Qi/Qc/Qr` 及 `1/Qr = 1/Qi + 1/Qc`。
- 建立 `Δf = f0/Qr` 与 time-domain ring-down 的统一图景。
- 区分 energy lifetime `τE = Qr/ω0` 与 amplitude lifetime `τA = 2Qr/ω0`。
- 推导 ideal hanger/notch resonator 的复数 `S21`。
- 解析推导 IQ circle 的圆心、半径与 resonance point。
- 引入 fixed-tone readout 的小信号线性化，以及 frequency / dissipation response 的几何直觉。
- 引入 cable delay、complex gain、effective asymmetry 和真实 VNA fitting 流程。
- 新增 `examples/resonator_basics.py`。
- 新增 `examples/resonator_fit_demo.py`。

## 维护
- 每个正式版本目录同时保存 PDF、LaTeX、Markdown、README、CHANGELOG 和配套代码。
- 最新 PDF 必须作为 `docs/v0.5/` 中的普通 Git 文件长期保存，不只作为 Actions artifact。

## 参考资料新增
- Khalil et al. 2012, Journal of Applied Physics, DOI 10.1063/1.3692073。
- Probst et al. 2015, Review of Scientific Instruments, DOI 10.1063/1.4907935。
''')

          (vdir/'examples'/'resonator_basics.py').write_text('''import numpy as np
import matplotlib.pyplot as plt


def s21_ideal(f, f0, Qi, Qc):
    Qr = 1.0 / (1.0 / Qi + 1.0 / Qc)
    x = (f - f0) / f0
    return 1.0 - (Qr / Qc) / (1.0 + 2j * Qr * x)


def main():
    f0 = 2.5e9
    Qi = 1.0e5
    Qc = 5.0e4
    Qr = 1.0 / (1.0 / Qi + 1.0 / Qc)
    linewidth = f0 / Qr
    f = np.linspace(f0 - 6 * linewidth, f0 + 6 * linewidth, 3000)
    s = s21_ideal(f, f0, Qi, Qc)

    f0_shifted = f0 - 10e3
    s_shifted = s21_ideal(f, f0_shifted, Qi, Qc)
    probe = f0
    s_dark = s21_ideal(np.array([probe]), f0, Qi, Qc)[0]
    s_light = s21_ideal(np.array([probe]), f0_shifted, Qi, Qc)[0]

    print(f"Qr = {Qr:.3f}")
    print(f"linewidth = {linewidth/1e3:.3f} kHz")
    print(f"tau_E = {Qr/(2*np.pi*f0)*1e6:.3f} us")
    print(f"tau_A = {Qr/(np.pi*f0)*1e6:.3f} us")
    print(f"fixed-tone dark  = {s_dark.real:+.6f} {s_dark.imag:+.6f}j")
    print(f"fixed-tone light = {s_light.real:+.6f} {s_light.imag:+.6f}j")
    print(f"delta S21        = {(s_light-s_dark).real:+.6f} {(s_light-s_dark).imag:+.6f}j")

    plt.figure(figsize=(7, 4.5))
    plt.plot((f-f0)/1e3, 20*np.log10(np.abs(s)), label='dark')
    plt.plot((f-f0)/1e3, 20*np.log10(np.abs(s_shifted)), label='f0 shifted -10 kHz')
    plt.xlabel('frequency offset from dark f0 (kHz)')
    plt.ylabel('|S21| (dB)')
    plt.legend()
    plt.tight_layout()
    plt.savefig('resonator_notch.png', dpi=180)

    plt.figure(figsize=(5.5, 5.5))
    plt.plot(s.real, s.imag, label='dark sweep')
    plt.plot([s_dark.real, s_light.real], [s_dark.imag, s_light.imag], 'o-', label='fixed-tone response')
    plt.xlabel('Re(S21)')
    plt.ylabel('Im(S21)')
    plt.axis('equal')
    plt.legend()
    plt.tight_layout()
    plt.savefig('resonator_iq.png', dpi=180)


if __name__ == '__main__':
    main()
''')

          (vdir/'examples'/'resonator_fit_demo.py').write_text('''import numpy as np
from scipy.optimize import least_squares


def s21_model(f, f0, Qr, Qc, phi, amp, phase, tau):
    x = (f - f0) / f0
    resonator = 1.0 - (Qr / Qc) * np.exp(1j * phi) / (1.0 + 2j * Qr * x)
    gain = amp * np.exp(1j * phase) * np.exp(-2j * np.pi * (f - f.mean()) * tau)
    return gain * resonator


def pack_residual(p, f, data):
    f0, logQr, logQc, phi, logamp, phase, tau = p
    model = s21_model(f, f0, np.exp(logQr), np.exp(logQc), phi, np.exp(logamp), phase, tau)
    r = model - data
    return np.concatenate([r.real, r.imag])


def main():
    rng = np.random.default_rng(1234)
    truth = dict(f0=2.5e9, Qr=3.3e4, Qc=5.0e4, phi=0.08, amp=0.93, phase=0.35, tau=18e-9)
    span = 500e3
    f = np.linspace(truth['f0']-span, truth['f0']+span, 2501)
    clean = s21_model(f, **truth)
    sigma = 2.0e-3
    data = clean + sigma*(rng.normal(size=f.size)+1j*rng.normal(size=f.size))

    p0 = np.array([2.50003e9, np.log(3.0e4), np.log(5.5e4), 0.0, np.log(1.0), 0.0, 10e-9])
    fit = least_squares(pack_residual, p0, args=(f, data), max_nfev=4000)
    f0, logQr, logQc, phi, logamp, phase, tau = fit.x
    Qr, Qc, amp = np.exp(logQr), np.exp(logQc), np.exp(logamp)
    Qi = 1.0 / (1.0/Qr - 1.0/Qc)

    print('Recovered parameters')
    print(f'f0  = {f0:.3f} Hz')
    print(f'Qr  = {Qr:.2f}')
    print(f'Qc  = {Qc:.2f}')
    print(f'Qi  = {Qi:.2f}')
    print(f'phi = {phi:.5f} rad')
    print(f'amp = {amp:.5f}')
    print(f'phase = {phase:.5f} rad')
    print(f'tau = {tau*1e9:.3f} ns')
    print(f'RMS complex residual = {np.sqrt(np.mean(np.abs(s21_model(f, f0, Qr, Qc, phi, amp, phase, tau)-data)**2)):.4e}')


if __name__ == '__main__':
    main()
''')

          (vdir/'examples'/'README.md').write_text('''# v0.5 Python examples

## 1. `resonator_basics.py`
生成理想 hanger/notch resonator 的幅频曲线、IQ circle，并演示 `f0` 发生 -10 kHz 位移时固定 probe tone 的复数 `ΔS21`。

依赖：`numpy`, `matplotlib`。

## 2. `resonator_fit_demo.py`
生成包含 complex gain、cable delay、有效 asymmetry 和复高斯噪声的 synthetic VNA 数据，再用 `scipy.optimize.least_squares` 拟合回参数。

依赖：`numpy`, `scipy`。

> 这是教学模型。真实实验可进一步加入频率相关 baseline、complex coupling quality factor、邻近模态、功率非线性与参数不确定度估计。
''')

          # Root README
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('> 当前版本：**v0.4（2026-09-06）** · 47 页', '> 当前版本：**v0.5（2026-09-07）** · 57 页')
          s = s.replace('(docs/v0.4/KID入门讲义_v0.4.pdf)', '(docs/v0.5/KID入门讲义_v0.5.pdf)')
          s = s.replace('(docs/v0.4/KID入门讲义_v0.4.tex)', '(docs/v0.5/KID入门讲义_v0.5.tex)')
          s = s.replace('(docs/v0.4/KID入门讲义_v0.4.md)', '(docs/v0.5/KID入门讲义_v0.5.md)')
          s = s.replace('[v0.4 修改记录](docs/v0.4/CHANGELOG.md)', '[v0.5 修改记录](docs/v0.5/CHANGELOG.md)')
          s = s.replace('到 v0.4 为止，讲义已经从“一个光子”推进到材料复电导：', '到 v0.5 为止，讲义已经从“一个光子”推进到可拟合的微波谐振器与 IQ 读出：')
          s = s.replace('`光子 / 光功率 → Cooper pair breaking → Nqp → σ1, σ2 → Rs, Xs → Lk, Qi → f0 → S21 / I-Q`', '`光子 / 光功率 → Cooper pair breaking → Nqp → σ1, σ2 → Rs, Xs → Lk, Qi → f0, Qr, Qc → S21(f) → IQ circle → fixed-tone I/Q`')
          block = '''\n### v0.5\n\n- `Qi/Qc/Qr` 与损耗/耦合率；\n- linewidth 与 ring-down；\n- ideal notch `S21` 与 IQ circle；\n- fixed-tone readout；\n- cable delay / complex gain / asymmetry / fitting；\n- Python 数值示例。\n'''
          if '### v0.5' not in s:
              s = s.replace('\n## 总体学习路线', block + '\n## 总体学习路线')
          oldtree = '''    ├── v0.3/\n    └── v0.4/\n        ├── KID入门讲义_v0.4.pdf\n        ├── KID入门讲义_v0.4.tex\n        ├── KID入门讲义_v0.4.md\n        ├── README.md\n        └── CHANGELOG.md'''
          newtree = '''    ├── v0.3/\n    ├── v0.4/\n    └── v0.5/\n        ├── KID入门讲义_v0.5.pdf\n        ├── KID入门讲义_v0.5.tex\n        ├── KID入门讲义_v0.5.md\n        ├── README.md\n        ├── CHANGELOG.md\n        └── examples/\n            ├── resonator_basics.py\n            └── resonator_fit_demo.py'''
          s = s.replace(oldtree, newtree)
          p.write_text(s)

          # Root ROADMAP
          p = Path('ROADMAP.md')
          s = p.read_text()
          old = '''## 下一阶段\n\n### v0.5 — 微波谐振器与 I-Q 读出\n\n计划：\n\n- `Qi`、`Qc`、`Qr` 的严格定义和能量意义；\n- notch resonator 的 `S21` 模型；\n- resonance linewidth 与 ring-down time；\n- I-Q 圆的几何意义；\n- cable delay、complex gain、impedance mismatch 对真实圆的扭曲；\n- resonance fitting；\n- 固定 tone 读出、phase/amplitude projection 与频率跟踪。\n\n### v0.6 — 光学响应、灵敏度与噪声\n'''
          new = '''### v0.5 — 微波谐振器与 I-Q 读出\n\n已完成：`Qi/Qc/Qr`、linewidth、ring-down、ideal notch、IQ circle、fixed tone、非理想传输、resonance fitting 与 Python 示例。\n\n## 下一阶段\n\n### v0.6 — 光学响应、灵敏度与噪声\n'''
          s = s.replace(old, new)
          p.write_text(s)

          # Root CHANGELOG
          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## v0.5 — 2026-09-07\n\n- 新增微波谐振器与 IQ 读出完整章节；\n- 推导 `Qi/Qc/Qr`、linewidth 与 ring-down；\n- 推导 ideal notch `S21` 与 IQ circle；\n- 引入 fixed-tone readout 和 frequency/dissipation response；\n- 引入 cable delay、complex gain、asymmetry 与 resonance fitting；\n- 新增两个 Python 教学示例。\n\n详见 [`docs/v0.5/CHANGELOG.md`](docs/v0.5/CHANGELOG.md)。\n\n'''
