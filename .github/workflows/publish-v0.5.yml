name: Publish KID guide v0.5

on:
  push:
    branches: [v0.5-publish]
    paths:
      - '.github/workflows/publish-v0.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed v0.5 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/v0.5
          cp 'docs/v0.4/KID入门讲义_v0.4.tex' 'docs/v0.5/KID入门讲义_v0.5.tex'
          cp 'docs/v0.4/KID入门讲义_v0.4.md' 'docs/v0.5/KID入门讲义_v0.5.md'
          base64 -d bootstrap/v0.5/tex.patch.gz.b64 | gzip -dc > /tmp/tex.patch
          base64 -d bootstrap/v0.5/md.patch.gz.b64 | gzip -dc > /tmp/md.patch
          patch 'docs/v0.5/KID入门讲义_v0.5.tex' < /tmp/tex.patch
          patch 'docs/v0.5/KID入门讲义_v0.5.md' < /tmp/md.patch
          grep -q '微波谐振器与 IQ 读出' 'docs/v0.5/KID入门讲义_v0.5.tex'
          grep -q 'resonator fitting' 'docs/v0.5/KID入门讲义_v0.5.md'

      - name: Compile v0.5 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.5
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.5.tex' >/tmp/v05-pass1.log
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.5.tex' | tee /tmp/v05-pass2.log
            grep -q 'Output written on KID入门讲义_v0.5.pdf (57 pages)' /tmp/v05-pass2.log
            test -s 'KID入门讲义_v0.5.pdf'

      - name: Commit v0.5 files to publication branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/v0.5
          rm -f .github/workflows/publish-v0.5.yml
          find docs/v0.5 -maxdepth 1 -type f \( -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.toc' -o -name '*.synctex.gz' \) -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v0.5
          git add -u
          git commit -m 'Publish KID Intro Guide v0.5 sources and PDF'
          git push origin HEAD:v0.5-publish
