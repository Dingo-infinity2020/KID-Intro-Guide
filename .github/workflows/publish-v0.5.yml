              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry)
          p.write_text(s)
          Path('LATEST_VERSION').write_text('v0.5\n')
          PY

      - name: Compile v0.5 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.5
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.5.tex' >/tmp/v05-pass1.log
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.5.tex' | tee /tmp/v05-pass2.log
            grep -q 'Output written on KID入门讲义_v0.5.pdf (57 pages)' /tmp/v05-pass2.log
            test -s 'KID入门讲义_v0.5.pdf'

      - name: Commit reviewed v0.5 release to publication branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/v0.5
          rm -f .github/workflows/publish-v0.5.yml
          find docs/v0.5 -maxdepth 1 -type f \( -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.toc' -o -name '*.synctex.gz' \) -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CHANGELOG.md LATEST_VERSION docs/v0.5 bootstrap .github/workflows/publish-v0.5.yml || true
          git add -u
          git commit -m 'Publish KID Intro Guide v0.5'
          git push origin HEAD:v0.5-publish
