name: Bootstrap KID guide v0.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v0.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate v0.3 sources
        run: python3 scripts/bootstrap_v03.py

      - name: Compile v0.3 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.3
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.3.tex"
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.3.tex"

      - name: Publish v0.3 and remove bootstrap files
        run: |
          set -euo pipefail
          rm -f docs/v0.3/_chapter4.tex.inc docs/v0.3/_chapter4.md.inc
          rm -f scripts/bootstrap_v03.py
          rm -f .github/workflows/bootstrap-v0.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KID Intro Guide v0.3"
          git push
