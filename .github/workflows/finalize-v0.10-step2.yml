# Trigger after assembling the complete exact payload.
name: Finalize v0.10 Step 2 structure

on:
  push:
    branches: [v0.10-structure]
    paths:
      - '.github/workflows/finalize-v0.10-step2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout structure branch
        uses: actions/checkout@v4
        with:
          ref: v0.10-structure
          fetch-depth: 0

      - name: Reconstruct reviewed Step 2 sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT='editorial/v0.10/step2'
          TEX_OUT="$ROOT/KID入门讲义_v0.10_step2.tex"
          MD_OUT="$ROOT/KID入门讲义_v0.10_step2.md"
          MD_BASE='docs/v0.9/KID入门讲义_v0.9.md'

          cat "$ROOT"/exact_payload_v2/tex_*.b64 | base64 --decode | gzip -dc > "$TEX_OUT"
          test "$(sha256sum "$TEX_OUT" | awk '{print $1}')" = 'c97e17901cc164cb99c015bd039a3eecae04f9c5c6a68d24229a0c404a1e8825'

          cp "$MD_BASE" "$MD_OUT"
          cat "$ROOT"/bootstrap/md_00.b64 "$ROOT"/bootstrap/md_01.b64 | base64 --decode | gzip -dc > /tmp/step2_md.patch
          patch --batch --forward --fuzz=3 "$MD_OUT" < /tmp/step2_md.patch
          echo "Step 2 Markdown SHA256: $(sha256sum "$MD_OUT" | awk '{print $1}')"

          # The LaTeX source is the authoritative reviewed/compiled source.  The
          # Markdown source is a synchronized reading/editing companion built
          # from the v0.9 source plus the reviewed Step-2 patch.  Patch offsets
          # can change byte-for-byte output without changing the intended
          # structure, so validate semantic anchors here instead of an obsolete
          # byte hash.
          grep -q '第一次接触 KID，只需要先知道这些' "$TEX_OUT"
          grep -q 'Part I' "$TEX_OUT"
          grep -q '第一次接触 KID，只需要先知道这些' "$MD_OUT"
          grep -q 'Part I' "$MD_OUT"
          grep -q '三条阅读路线' "$MD_OUT"

      - name: Compile 128-page Step 2 PDF
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd editorial/v0.10/step2
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10_step2.tex'
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10_step2.tex'
            test -s 'KID入门讲义_v0.10_step2.pdf'
            grep -Eq 'Output written on .*\(128 pages' 'KID入门讲义_v0.10_step2.log'

      - name: Commit clean Step 2 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ROOT='editorial/v0.10/step2'
          rm -f "$ROOT"/*.aux "$ROOT"/*.log "$ROOT"/*.out "$ROOT"/*.toc "$ROOT"/*.orig "$ROOT"/*.rej
          rm -rf "$ROOT/bootstrap" "$ROOT/bootstrap2" "$ROOT/exact_payload" "$ROOT/exact_payload_v2"
          rm -f .github/workflows/finalize-v0.10-step2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v0.10 Step 2 architecture checkpoint'
          git push origin HEAD:v0.10-structure
