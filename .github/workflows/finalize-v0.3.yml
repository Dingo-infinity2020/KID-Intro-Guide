name: Finalize KID guide v0.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v0.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize v0.3 references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          texp = Path('docs/v0.3/KID入门讲义_v0.3.tex')
          mdp = Path('docs/v0.3/KID入门讲义_v0.3.md')
          tex = texp.read_text(encoding='utf-8')
          tex = tex.replace('M. Tinkham, \\textit{Introduction to Superconductivity}, 2nd ed., Dover Publications (2004 reprint).',
                            'M. Tinkham, \\textit{Introduction to Superconductivity}, 2nd ed., McGraw--Hill (1996).')
          tex = tex.replace('P. J. de Visser et al., ``Number Fluctuations of Sparse Quasiparticles in a Superconductor,\'\' \\textit{Physical Review Letters}, 106, 167004 (2011/2012 literature context).',
                            'P. J. de Visser et al., ``Generation-Recombination Noise: The Fundamental Sensitivity Limit for Kinetic Inductance Detectors,\'\' \\textit{Journal of Low Temperature Physics}, 167, 335--340 (2012).')
          texp.write_text(tex, encoding='utf-8')
          md = mdp.read_text(encoding='utf-8')
          md = md.replace('5. M. Tinkham, *Introduction to Superconductivity*, 2nd ed., Dover Publications.',
                          '5. M. Tinkham, *Introduction to Superconductivity*, 2nd ed., McGraw–Hill (1996).')
          md = md.replace('8. P. J. de Visser et al., generation–recombination / sparse quasiparticle fluctuation studies in superconducting resonators.',
                          '8. P. J. de Visser et al., “Generation-Recombination Noise: The Fundamental Sensitivity Limit for Kinetic Inductance Detectors,” *Journal of Low Temperature Physics*, 167, 335–340 (2012).')
          mdp.write_text(md, encoding='utf-8')
          PY

      - name: Recompile v0.3 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.3
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.3.tex"
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.3.tex"

      - name: Publish final v0.3 and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v0.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize KID Intro Guide v0.3"
          git push
