name: Finalize KID guide v0.6

'on':
  push:
    branches: [v0.6-publish]
    paths:
      - '.github/workflows/publish-v0.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed v0.6 sources and repository metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/v0.6/examples

          # LaTeX remains the authoritative source. Rebuild it from the canonical v0.5 source
          # using the already-reviewed v0.6 patch.
          cp 'docs/v0.5/KID入门讲义_v0.5.tex' 'docs/v0.6/KID入门讲义_v0.6.tex'
          base64 -d bootstrap/v0.6/tex.patch.gz.b64 | gzip -dc > /tmp/tex.patch
          patch 'docs/v0.6/KID入门讲义_v0.6.tex' < /tmp/tex.patch
          grep -q '光学响应、噪声与 NEP' 'docs/v0.6/KID入门讲义_v0.6.tex'
          grep -q 'Version 0.6' 'docs/v0.6/KID入门讲义_v0.6.tex'

          # Markdown is reconstructed semantically instead of applying the historical
          # line-sensitive patch, so small v0.5 text drift cannot block a release.
          cp 'docs/v0.5/KID入门讲义_v0.5.md' 'docs/v0.6/KID入门讲义_v0.6.md'
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/v0.6/KID入门讲义_v0.6.md')
          s = p.read_text()
          s = s.replace('# KID 入门讲义 v0.5', '# KID 入门讲义 v0.6', 1)
          s = s.replace('**版本：v0.5 · 2026-09-07**', '**版本：v0.6 · 2026-09-07**', 1)
          s = s.replace('examples/v0.5/resonator_basics.py', 'examples/v0.6/resonator_basics.py')
          s = s.replace('examples/v0.5/resonator_fit_demo.py', 'examples/v0.6/resonator_fit_demo.py')
          chapter = r'''

          # 光学响应、噪声与 NEP

          本章对应 LaTeX/PDF v0.6 的完整第 7 章。核心链条：

          $$P_{\rm abs}\to \Gamma_{\rm qp}\to N_{\rm qp}\to (f_0,Q_i)\to I/Q.$$

          ## 从光功率到准粒子

          $$\Gamma_{\rm qp}\simeq \frac{\eta_{\rm pb}P_{\rm abs}}{\Delta},$$

          在线性 lifetime 模型中

          $$\delta N_{\rm qp}\simeq \frac{\eta_{\rm pb}\tau_{\rm qp}}{\Delta}\delta P_{\rm abs}.$$

          定义 $x=\delta f_0/f_0$，则 frequency responsivity

          $$\mathcal R_x=\frac{dx}{dP_{\rm abs}}=\frac{dx}{dN_{\rm qp}}\frac{\eta_{\rm pb}\tau_{\rm qp}}{\Delta}.$$

          ## 动态响应

          $$H_{\rm qp}(f)=\frac{1}{1+j2\pi f\tau_{\rm qp}},\qquad f_{3\rm dB}=\frac{1}{2\pi\tau_{\rm qp}}.$$

          同时 resonator ring-down 也提供一个低通时间尺度。

          ## NEP

          若 observable 是 $x$，则

          $$\mathrm{NEP}(f)=\frac{\sqrt{S_x(f)}}{|dx/dP_{\rm abs}|}.$$

          单位为 $\mathrm{W}/\sqrt{\mathrm{Hz}}$。

          常见 photon noise 单模近似：

          $$\mathrm{NEP}_{\rm ph}^2\simeq 2h\nu P_{\rm abs}+\frac{2P_{\rm abs}^2}{\Delta\nu}.$$

          常见低频 GR noise 形式：

          $$\mathrm{NEP}_{\rm GR}\simeq \frac{2\Delta}{\eta_{\rm pb}}\sqrt{\frac{N_{\rm qp}}{\tau_{\rm qp}}}.$$

          TLS 往往表现为低频 excess frequency noise，amplifier/readout noise 则发生在 detector 之后。独立噪声源可在 input-referred NEP 平方上相加。

          本章还加入了 150 GHz Al LEKID 的 $1\,\mathrm{pW}$ 数值例子，以及两个 Python 示例用于 responsivity 和 noise budget。
          '''
          marker = '# 后续版本计划'
          if '# 光学响应、噪声与 NEP' not in s:
              s = s.replace(marker, chapter.strip() + '\n\n' + marker, 1)
          s = s.replace('- v0.5：$Q_i/Q_c/Q_r$、notch resonator、IQ circle、固定 tone 读出与实际 fitting',
                        '- v0.6：$Q_i/Q_c/Q_r$、notch resonator、IQ circle、固定 tone 读出与实际 fitting', 1)
          p.write_text(s)
          PY
          grep -q '# KID 入门讲义 v0.6' 'docs/v0.6/KID入门讲义_v0.6.md'
          grep -q '# 光学响应、噪声与 NEP' 'docs/v0.6/KID入门讲义_v0.6.md'

          # Inherit the v0.5 resonator examples, then add the two new v0.6 examples.
          cp -a docs/v0.5/examples/. docs/v0.6/examples/

          cat > docs/v0.6/examples/optical_responsivity_demo.py <<'PY'
          import numpy as np
          import matplotlib.pyplot as plt

          h = 6.62607015e-34
          kB = 1.380649e-23


          def gap_weak_bcs(Tc):
              return 1.764 * kB * Tc


          def nqp_steady(P_abs, eta_pb, tau_qp, Delta):
              return eta_pb * P_abs * tau_qp / Delta


          def main():
              Tc = 1.2
              eta_pb = 0.57
              tau_qp = 300e-6
              Delta = gap_weak_bcs(Tc)
              # Educational calibration coefficient. Replace with MB calculation or measurement.
              dx_dNqp = -4.0e-13

              P = np.logspace(-14, -11, 250)
              N = nqp_steady(P, eta_pb, tau_qp, Delta)
              x = dx_dNqp * N
              R_x = dx_dNqp * eta_pb * tau_qp / Delta

              print(f"Delta = {Delta/1.602176634e-22:.4f} meV")
              print(f"dx/dP_abs = {R_x:.3e} 1/W")
              print(f"Nqp at 1 pW = {nqp_steady(1e-12, eta_pb, tau_qp, Delta):.3e}")
              print(f"fractional shift at 1 pW = {dx_dNqp*nqp_steady(1e-12, eta_pb, tau_qp, Delta):.3e}")
              print(f"qp 3-dB bandwidth = {1/(2*np.pi*tau_qp):.1f} Hz")

              plt.figure(figsize=(7, 4.5))
              plt.loglog(P, np.abs(x))
              plt.xlabel('absorbed optical power (W)')
              plt.ylabel('|delta f0 / f0|')
              plt.tight_layout()
              plt.savefig('optical_responsivity.png', dpi=180)

              f = np.logspace(-1, 5, 800)
              plt.figure(figsize=(7, 4.5))
              for tau in [30e-6, 300e-6, 3e-3]:
                  H = 1/np.sqrt(1+(2*np.pi*f*tau)**2)
                  plt.loglog(f, H, label=f'tau_qp={tau*1e6:.0f} us')
              plt.xlabel('Fourier frequency (Hz)')
              plt.ylabel('|H_qp(f)|')
              plt.legend()
              plt.tight_layout()
              plt.savefig('qp_bandwidth.png', dpi=180)


          if __name__ == '__main__':
              main()
          PY

          cat > docs/v0.6/examples/noise_budget_demo.py <<'PY'
          import numpy as np
          import matplotlib.pyplot as plt

          h = 6.62607015e-34
          kB = 1.380649e-23


          def gap_weak_bcs(Tc):
              return 1.764 * kB * Tc


          def photon_nep(P_abs, nu, optical_bw):
              return np.sqrt(2*h*nu*P_abs + 2*P_abs**2/optical_bw)


          def gr_nep(P_abs, Delta, eta_pb):
              # Common low-frequency result under the one-sided PSD convention used in the guide.
              return np.sqrt(4*Delta*P_abs/eta_pb)


          def main():
              nu = 150e9
              optical_bw = 30e9
              Tc = 1.2
              eta_pb = 0.57
              Delta = gap_weak_bcs(Tc)

              P = np.logspace(-14, -10, 300)
              nep_ph = photon_nep(P, nu, optical_bw)
              nep_gr = gr_nep(P, Delta, eta_pb)
              nep_quad = np.sqrt(nep_ph**2 + nep_gr**2)

              p0 = 1e-12
              print(f"At P_abs = {p0:.1e} W")
              print(f"photon NEP = {photon_nep(p0, nu, optical_bw):.3e} W/sqrt(Hz)")
              print(f"GR NEP     = {gr_nep(p0, Delta, eta_pb):.3e} W/sqrt(Hz)")

              measured_sqrt_Sx = 1e-9  # 1/sqrt(Hz)
              responsivity_x = 1e6     # 1/W
              print(f"Example measured NEP = {measured_sqrt_Sx/responsivity_x:.3e} W/sqrt(Hz)")

              plt.figure(figsize=(7, 4.5))
              plt.loglog(P, nep_ph, label='photon')
              plt.loglog(P, nep_gr, label='GR')
              plt.loglog(P, nep_quad, label='quadrature sum')
              plt.xlabel('absorbed optical power (W)')
              plt.ylabel('NEP (W / sqrt(Hz))')
              plt.legend()
              plt.tight_layout()
              plt.savefig('noise_budget.png', dpi=180)


          if __name__ == '__main__':
              main()
          PY

          cat > docs/v0.6/examples/README.md <<'EOF'
          # v0.6 Python examples

          本目录对应 v0.5-v0.6 的可运行数值练习：

          - `resonator_basics.py`：ideal notch、IQ circle、frequency shift 与 fixed-tone response；
          - `resonator_fit_demo.py`：包含 complex gain、cable delay、asymmetry 与噪声的拟合示例；
          - `optical_responsivity_demo.py`：`P_abs -> Nqp -> δf0/f0`，以及 quasiparticle lifetime 对响应带宽的限制；
          - `noise_budget_demo.py`：photon / GR NEP，以及 measured fractional-frequency noise 的 input-referred NEP。

          这些脚本是教学用最小模型。真实器件分析时，应替换为实际材料、光学效率、带宽、MB 模型与 PSD convention。
          EOF

          cat > docs/v0.6/README.md <<'EOF'
          # KID 入门讲义 v0.6

          主题：**光学响应、噪声与 NEP：把“看到光”变成可比较的灵敏度指标**。

          本版本完整继承 v0.5，并新增：
          - `P_abs -> Gamma_qp -> N_qp` 的光学响应链；
          - pair-breaking efficiency 与 quasiparticle lifetime；
          - frequency / dissipation / I-Q responsivity；
          - quasiparticle 与 resonator 两个动态时间尺度；
          - PSD / ASD / NEP 的单位与 input-referred noise；
          - photon、GR、TLS、amplifier/readout noise；
          - 150 GHz Al LEKID 数值例子；
          - 两个新的 Python 示例，并继承 v0.5 的两个 resonator 示例。

          正式文件包括 PDF、LaTeX、Markdown、CHANGELOG 和 `examples/`。
          EOF

          cat > docs/v0.6/CHANGELOG.md <<'EOF'
          # v0.6 Changelog — 2026-09-07

          ## 新增
          - 新增第 7 章“光学响应、噪声与 NEP”。
          - 从 absorbed optical power 与 pair-breaking efficiency 推到 quasiparticle generation rate。
          - 建立线性工作点附近 `dNqp/dPabs ≈ eta_pb tau_qp / Delta`。
          - 定义 frequency、dissipation 与 complex I/Q responsivity。
          - 引入 quasiparticle lifetime 与 resonator ring-down 的级联动态响应。
          - 区分 PSD、ASD，并严格定义 input-referred NEP。
          - 引入 photon shot / bunching noise、generation-recombination noise、TLS noise 与 amplifier/readout noise。
          - 给出 150 GHz、Al、1 pW absorbed loading 的数量级例子。
          - 新增 `examples/optical_responsivity_demo.py` 与 `examples/noise_budget_demo.py`。

          ## 视觉与维护
          - 完整渲染检查新增章节及流程图，箭头语义延续 v0.2+ 规则。
          - 每个正式版本继续同时保存 PDF + LaTeX + Markdown + README + CHANGELOG + 配套代码。
          - 最新 PDF 必须作为普通 Git 文件存在于 `docs/v0.6/`。

          ## 说明
          - GR noise 中的 factor-of-two 依赖 one-sided/two-sided PSD 和 quasiparticle generation convention；正文显式提醒比较文献时先统一约定。
          EOF

          cat > README.md <<'EOF'
          # KID Intro Guide｜KID 入门讲义

          一份面向 **Kinetic Inductance Detector（KID，动能电感探测器）/ LEKID** 初学者与器件设计者的中文开源讲义。

          本项目不采用“先学完整套凝聚态物理，再开始做器件”的路线，而是从器件设计者真正需要理解的物理因果链出发：

          **光场与吸收 → Cooper pair / 准粒子 → 动能电感与复电导 → GHz 谐振器 → S21 / I-Q 读出 → 光学响应 → 噪声与 NEP → LEKID 电磁设计与实验。**

          > 当前版本：**v0.6（2026-09-07）** · 67 页

          ## 最新版本

          - [PDF 阅读版](docs/v0.6/KID入门讲义_v0.6.pdf)
          - [LaTeX 权威排版源文件](docs/v0.6/KID入门讲义_v0.6.tex)
          - [Markdown 内容源文件](docs/v0.6/KID入门讲义_v0.6.md)
          - [v0.6 修改记录](docs/v0.6/CHANGELOG.md)
          - [v0.6 Python 示例](docs/v0.6/examples/)

          ## 当前已经打通的主链

          到 v0.6 为止，讲义已经从“一个光子”推进到可比较的输入端灵敏度：

          `P_abs → Γ_qp → Nqp → σ1, σ2 → Rs, Xs → Lk, Qi → f0, Qr, Qc → S21(f) → IQ circle → fixed-tone I/Q → responsivity → PSD/ASD → input-referred NEP`

          ### v0.1

          建立第一条完整因果链：

          `入射光子 → pair breaking → Nqp ↑ → ns ↓ → Lk ↑ → f0 ↓ → S21 / I-Q 改变`

          ### v0.2

          - 重做并统一流程图语义；
          - 从 `m dv/dt = qE` 推导 kinetic inductance；
          - 引入 London penetration depth、sheet kinetic inductance 与 `α`；
          - 建立 `δf0/f0` 与 `δLk/Lk` 的关系。

          ### v0.3

          - Cooper pair 与 BCS 能隙；
          - pair-breaking threshold；
          - thermal / non-equilibrium quasiparticles；
          - generation-recombination；
          - quasiparticle lifetime；
          - `Tc` 与 150 GHz 材料选择的直接关系。

          ### v0.4

          - `σ = σ1 - iσ2`；
          - Mattis–Bardeen 的器件化理解；
          - `σ → Zs = Rs + iXs`；
          - 薄膜 `Z□ ≈ 1/(tσ)`；
          - `Lk,□ ≈ 1/(ωtσ2)`；
          - `δf0/f0 ≈ (α/2)δσ2/σ2`；
          - `1/Qi,qp ≈ ασ1/σ2` 的直观薄膜近似；
          - GHz readout 与 150 GHz optical absorber 的跨频段建模边界。

          ### v0.5

          - `Qi/Qc/Qr` 与损耗/耦合率；
          - linewidth 与 ring-down；
          - ideal notch `S21` 与 IQ circle；
          - fixed-tone readout；
          - cable delay / complex gain / asymmetry / fitting；
          - Python 数值示例。

          ### v0.6

          - `P_abs → Γ_qp → Nqp` 的光学响应链；
          - pair-breaking efficiency 与 quasiparticle lifetime；
          - frequency / dissipation / complex I-Q responsivity；
          - quasiparticle 与 resonator 两个动态时间尺度；
          - PSD / ASD 与 input-referred NEP；
          - photon shot / bunching、GR、TLS、amplifier/readout noise；
          - 150 GHz Al LEKID、1 pW absorbed loading 数值例子；
          - 两个新的 Python 示例。

          ## 总体学习路线

          | 模块 | 核心主题 | 状态 |
          |---|---|---|
          | M1 | 从光子到 `S21` | 已完成 |
          | M2 | 超导基础：Cooper pair、能隙、准粒子 | 已完成 |
          | M3 | 动能电感与复电导 | 已完成至 MB / surface impedance |
          | M4 | 微波谐振器与 I-Q 圆 | 已完成 |
          | M5 | 光学响应与 responsivity | 已完成基础模型 |
          | M6 | 噪声与 NEP | 已完成基础 noise budget |
          | M7 | LEKID 电磁设计 | 下一阶段 v0.7 |
          | M8 | 阵列与频分复用读出 | 后续 |
          | M9 | Sonnet / CST / 实验闭环 | 后续 |
          | M10 | 从学习走向可发表的研究问题 | 后续 |

