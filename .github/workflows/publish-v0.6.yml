name: Publish KID guide v0.6

'on':
  push:
    branches: [v0.6-publish]
    paths:
      - '.github/workflows/publish-v0.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v0.6 sources and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/v0.6/examples
          cp 'docs/v0.5/KID入门讲义_v0.5.tex' 'docs/v0.6/KID入门讲义_v0.6.tex'
          cp 'docs/v0.5/KID入门讲义_v0.5.md' 'docs/v0.6/KID入门讲义_v0.6.md'
          base64 -d bootstrap/v0.6/tex.patch.gz.b64 | gzip -dc > /tmp/tex.patch
          base64 -d bootstrap/v0.6/md.patch.gz.b64 | gzip -dc > /tmp/md.patch
          patch 'docs/v0.6/KID入门讲义_v0.6.tex' < /tmp/tex.patch
          patch 'docs/v0.6/KID入门讲义_v0.6.md' < /tmp/md.patch
          grep -q '光学响应、噪声与 NEP' 'docs/v0.6/KID入门讲义_v0.6.tex'
          grep -q 'Version 0.6' 'docs/v0.6/KID入门讲义_v0.6.tex'

          cat > docs/v0.6/README.md <<'EOF'
          # KID 入门讲义 v0.6

          主题：**光学响应、噪声与 NEP：把“看到光”变成可比较的灵敏度指标**。

          本版本完整继承 v0.5，并新增：
          - `P_abs -> Gamma_qp -> N_qp` 的光学响应链；
          - pair-breaking efficiency 与 quasiparticle lifetime；
          - frequency / dissipation / I-Q responsivity；
          - quasiparticle 与 resonator 两个动态时间尺度；
          - PSD / ASD / NEP 与 input-referred noise；
          - photon、GR、TLS、amplifier noise；
          - 150 GHz Al LEKID 数值例子；
          - 两个可运行 Python 示例。
          EOF

          cat > docs/v0.6/CHANGELOG.md <<'EOF'
          # v0.6 Changelog — 2026-09-07

          ## 新增
          - 新增第 7 章“光学响应、噪声与 NEP”。
          - 从 absorbed optical power 与 pair-breaking efficiency 推到 quasiparticle generation rate。
          - 建立线性工作点附近 `dNqp/dPabs ≈ eta_pb tau_qp / Delta`。
          - 定义 frequency、dissipation 与 complex I/Q responsivity。
          - 引入 quasiparticle lifetime 与 resonator ring-down 的级联动态响应。
          - 区分 PSD、ASD，并定义 input-referred NEP。
          - 引入 photon shot / bunching、GR、TLS 与 amplifier/readout noise。
          - 给出 150 GHz、Al、1 pW absorbed loading 的数量级例子。
          - 新增 optical responsivity 与 noise budget Python 示例。

          ## 维护
          - 最新 PDF 继续作为普通 Git 文件保存在 `docs/v0.6/`。
          - 新增章节继续遵守 v0.2+ 的流程图箭头语义规则。
          EOF

          cat > docs/v0.6/examples/optical_responsivity_demo.py <<'PY'
          import numpy as np
          import matplotlib.pyplot as plt
          kB = 1.380649e-23
          def gap_weak_bcs(Tc): return 1.764*kB*Tc
          def nqp_steady(P_abs, eta_pb, tau_qp, Delta): return eta_pb*P_abs*tau_qp/Delta
          def main():
              Tc, eta_pb, tau_qp = 1.2, 0.57, 300e-6
              Delta = gap_weak_bcs(Tc)
              dx_dNqp = -4.0e-13
              P = np.logspace(-14, -11, 250)
              N = nqp_steady(P, eta_pb, tau_qp, Delta)
              x = dx_dNqp*N
              R_x = dx_dNqp*eta_pb*tau_qp/Delta
              print(f'Delta = {Delta/1.602176634e-22:.4f} meV')
              print(f'dx/dP_abs = {R_x:.3e} 1/W')
              print(f'Nqp at 1 pW = {nqp_steady(1e-12,eta_pb,tau_qp,Delta):.3e}')
              print(f'qp 3-dB bandwidth = {1/(2*np.pi*tau_qp):.1f} Hz')
              plt.figure(figsize=(7,4.5)); plt.loglog(P,np.abs(x)); plt.xlabel('absorbed optical power (W)'); plt.ylabel('|delta f0 / f0|'); plt.tight_layout(); plt.savefig('optical_responsivity.png',dpi=180)
              f=np.logspace(-1,5,800); plt.figure(figsize=(7,4.5))
              for tau in [30e-6,300e-6,3e-3]:
                  H=1/np.sqrt(1+(2*np.pi*f*tau)**2); plt.loglog(f,H,label=f'tau_qp={tau*1e6:.0f} us')
              plt.xlabel('Fourier frequency (Hz)'); plt.ylabel('|H_qp(f)|'); plt.legend(); plt.tight_layout(); plt.savefig('qp_bandwidth.png',dpi=180)
          if __name__=='__main__': main()
          PY

          cat > docs/v0.6/examples/noise_budget_demo.py <<'PY'
          import numpy as np
          import matplotlib.pyplot as plt
          h=6.62607015e-34; kB=1.380649e-23
          def gap_weak_bcs(Tc): return 1.764*kB*Tc
          def photon_nep(P,nu,bw): return np.sqrt(2*h*nu*P+2*P**2/bw)
          def gr_nep(P,Delta,eta): return np.sqrt(4*Delta*P/eta)
          def main():
              nu,bw,Tc,eta=150e9,30e9,1.2,0.57; Delta=gap_weak_bcs(Tc); P=np.logspace(-14,-10,300)
              ph=photon_nep(P,nu,bw); gr=gr_nep(P,Delta,eta); total=np.sqrt(ph**2+gr**2)
              p0=1e-12; print(f'photon NEP @1pW = {photon_nep(p0,nu,bw):.3e} W/sqrt(Hz)'); print(f'GR NEP @1pW = {gr_nep(p0,Delta,eta):.3e} W/sqrt(Hz)')
              measured_sqrt_Sx=1e-9; responsivity_x=1e6; print(f'example measured NEP = {measured_sqrt_Sx/responsivity_x:.3e} W/sqrt(Hz)')
              plt.figure(figsize=(7,4.5)); plt.loglog(P,ph,label='photon'); plt.loglog(P,gr,label='GR'); plt.loglog(P,total,label='quadrature sum'); plt.xlabel('absorbed optical power (W)'); plt.ylabel('NEP (W / sqrt(Hz))'); plt.legend(); plt.tight_layout(); plt.savefig('noise_budget.png',dpi=180)
          if __name__=='__main__': main()
          PY

          cat > docs/v0.6/examples/README.md <<'EOF'
          # v0.6 Python examples
          - `optical_responsivity_demo.py`: optical power -> quasiparticle number -> fractional frequency response and lifetime bandwidth.
          - `noise_budget_demo.py`: photon/GR NEP and an example of input-referring measured fractional-frequency noise.
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text()
          s=s.replace('> 当前版本：**v0.5（2026-09-07）** · 57 页','> 当前版本：**v0.6（2026-09-07）** · 67 页')
          for ext in ('pdf','tex','md'):
              s=s.replace(f'docs/v0.5/KID入门讲义_v0.5.{ext}',f'docs/v0.6/KID入门讲义_v0.6.{ext}')
          s=s.replace('[v0.5 修改记录](docs/v0.5/CHANGELOG.md)','[v0.6 修改记录](docs/v0.6/CHANGELOG.md)')
          s=s.replace('到 v0.5 为止','到 v0.6 为止')
          block='''\n### v0.6\n\n- optical responsivity 与 pair-breaking efficiency；\n- quasiparticle lifetime 与 detector bandwidth；\n- PSD / ASD / input-referred NEP；\n- photon / GR / TLS / amplifier noise；\n- 150 GHz Al 数值例子与 Python noise budget。\n'''
          if '### v0.6' not in s: s=s.replace('\n## 总体学习路线',block+'\n## 总体学习路线')
          s=s.replace('M5 | 光学响应 | 光功率如何映射为 `Δf0`、相位和幅度？ | responsivity 模型 |','M5 | 光学响应 | 光功率如何映射为 `Δf0`、相位和幅度？ | 已完成至 responsivity / dynamics |')
          s=s.replace('M6 | 噪声与 NEP | 什么时候是 photon-noise limited？TLS、GR、放大器噪声如何比较？ | noise budget |','M6 | 噪声与 NEP | 什么时候是 photon-noise limited？TLS、GR、放大器噪声如何比较？ | 已完成基础 noise budget |')
          p.write_text(s)

          p=Path('ROADMAP.md'); s=p.read_text()
          if '## v0.6 — 光学响应、噪声与 NEP（已完成）' not in s:
              s += '''\n\n## v0.6 — 光学响应、噪声与 NEP（已完成）\n\n- optical power -> quasiparticle -> responsivity；\n- detector dynamics；\n- PSD / ASD / NEP；\n- photon / GR / TLS / amplifier noise。\n\n## 下一阶段：v0.7 — LEKID 电磁设计\n\n- meander absorber / kinetic inductor 双重角色；\n- IDC 与 TLS / capacitance；\n- coupling 与 multiplexing constraint；\n- 双偏振、waveguide aperture、backshort；\n- optical absorption 与 resonator design 的联合参数化。\n'''
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          entry='''## v0.6 — 2026-09-07\n\n- 新增 optical responsivity、detector dynamics、PSD/ASD/NEP；\n- 新增 photon / GR / TLS / amplifier noise budget；\n- 新增 150 GHz Al 数值例子与两个 Python 示例；\n- 正式 PDF、LaTeX、Markdown 与代码保存在 `docs/v0.6/`。\n\n'''
          if not s.startswith('## v0.6'): s=entry+s
          p.write_text(s)
          Path('LATEST_VERSION').write_text('v0.6\n')
          PY

      - name: Compile v0.6 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.6
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.6.tex'
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.6.tex'
            test -s 'KID入门讲义_v0.6.pdf'
            pages=$(pdfinfo 'KID入门讲义_v0.6.pdf' | awk '/^Pages:/ {print $2}')
            test "$pages" -ge 67

      - name: Test Python examples
        shell: bash
        run: |
          python -m py_compile docs/v0.6/examples/*.py

      - name: Publish v0.6 files and clean bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/v0.6
          rm -f .github/workflows/publish-v0.6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CHANGELOG.md LATEST_VERSION docs/v0.6 bootstrap .github/workflows || true
          git commit -m 'Publish KID Intro Guide v0.6'
          git push origin HEAD:v0.6-publish
