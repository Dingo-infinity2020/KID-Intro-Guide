          PY

      - name: Compile v0.6 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.6
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.6.tex'
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.6.tex'
            test -s 'KID入门讲义_v0.6.pdf'
            grep -Fq 'Output written on KID入门讲义_v0.6.pdf (67 pages).' 'KID入门讲义_v0.6.log'

      - name: Validate Python examples and version pointers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile docs/v0.6/examples/*.py
          test "$(tr -d '[:space:]' < LATEST_VERSION)" = 'v0.6'
          grep -q '当前版本：\*\*v0.6' README.md
          grep -q 'v0.7 — LEKID 电磁设计' ROADMAP.md
          test -s 'docs/v0.6/KID入门讲义_v0.6.pdf'

      - name: Publish final v0.6 and remove one-time release machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/v0.6
          rm -f .github/workflows/publish-v0.6.yml
          rm -f .github/workflows/build-v0.6-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize KID Intro Guide v0.6'
          git push origin HEAD:v0.6-publish
