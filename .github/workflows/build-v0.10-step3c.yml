name: Build v0.10 Step 3-C beginner bridges

on:
  push:
    branches: [v0.10-step3-editorial]
    paths:
      - '.github/workflows/build-v0.10-step3c.yml'

permissions:
  contents: write

jobs:
  build-step3c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Step 3 branch
        uses: actions/checkout@v4
        with:
          ref: v0.10-step3-editorial
          fetch-depth: 0

      - name: Apply Step 3-C beginner bridge transform
        run: python3 editorial/v0.10/step3/step3c_transform.py

      - name: Compile Step 3-C PDF
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd editorial/v0.10/step3
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10_step3.tex'
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10_step3.tex'
            test -s 'KID入门讲义_v0.10_step3.pdf'
            pages=$(grep -Eo 'Output written on .*\([0-9]+ pages' 'KID入门讲义_v0.10_step3.log' | tail -1 | grep -Eo '[0-9]+ pages' | awk '{print $1}')
            test -n "$pages"
            test "$pages" -ge 120
            echo "Compiled Step 3-C PDF: $pages pages"

      - name: Commit Step 3-C checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ROOT='editorial/v0.10/step3'
          rm -f "$ROOT"/*.aux "$ROOT"/*.log "$ROOT"/*.out "$ROOT"/*.toc "$ROOT"/*.orig "$ROOT"/*.rej
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/KID入门讲义_v0.10_step3.tex" "$ROOT/KID入门讲义_v0.10_step3.md" "$ROOT/KID入门讲义_v0.10_step3.pdf" "$ROOT/STEP3_NOTES.md" "$ROOT/STEP3_AUDIT.md"
          git commit -m 'Add v0.10 Step 3-C beginner knowledge bridges'
          git push origin HEAD:v0.10-step3-editorial
