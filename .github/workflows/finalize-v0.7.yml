name: Finalize KID guide v0.7

'on':
  push:
    branches: [v0.7-publish]
    paths:
      - '.github/workflows/finalize-v0.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed v0.7 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/v0.7/examples
          cp 'docs/v0.6/KID入门讲义_v0.6.tex' 'docs/v0.7/KID入门讲义_v0.7.tex'
          cp 'docs/v0.6/KID入门讲义_v0.6.md' 'docs/v0.7/KID入门讲义_v0.7.md'
          cat bootstrap/v0.7/tex_01.b64 bootstrap/v0.7/tex_02.b64 bootstrap/v0.7/tex_03.b64 bootstrap/v0.7/tex_04.b64 bootstrap/v0.7/tex_05a.b64 bootstrap/v0.7/tex_05b.b64 | base64 --decode | gzip -dc > /tmp/v07-tex.patch
          cat bootstrap/v0.7/mdg_01.b64 bootstrap/v0.7/mdg_02.b64 bootstrap/v0.7/mdg_03.b64 bootstrap/v0.7/mdg_04.b64 | base64 --decode | gzip -dc > /tmp/v07-md.patch
          patch --no-backup-if-mismatch 'docs/v0.7/KID入门讲义_v0.7.tex' < /tmp/v07-tex.patch
          patch --no-backup-if-mismatch 'docs/v0.7/KID入门讲义_v0.7.md' < /tmp/v07-md.patch
          cp docs/v0.6/examples/resonator_basics.py docs/v0.7/examples/
          cp docs/v0.6/examples/resonator_fit_demo.py docs/v0.7/examples/
          cp docs/v0.6/examples/optical_responsivity_demo.py docs/v0.7/examples/
          cp docs/v0.6/examples/noise_budget_demo.py docs/v0.7/examples/
          grep -q 'LEKID 电磁设计' 'docs/v0.7/KID入门讲义_v0.7.tex'
          grep -q 'Version 0.7' 'docs/v0.7/KID入门讲义_v0.7.tex'
          test "$(tr -d '[:space:]' < LATEST_VERSION)" = "v0.7"

      - name: Compile v0.7 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.7
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.7.tex' | tee /tmp/v07-xe1.log
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.7.tex' | tee /tmp/v07-xe2.log
            test -s 'KID入门讲义_v0.7.pdf'
            grep -q 'Output written on KID入门讲义_v0.7.pdf (81 pages' /tmp/v07-xe2.log

      - name: Validate examples and repository pointers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile docs/v0.7/examples/*.py
          grep -q 'v0.7' README.md
          grep -q 'v0.7' ROADMAP.md
          grep -q 'v0.7' CHANGELOG.md
          test "$(tr -d '[:space:]' < LATEST_VERSION)" = "v0.7"

      - name: Publish final v0.7 and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf bootstrap/v0.7
          git rm -f .github/workflows/finalize-v0.7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CHANGELOG.md LATEST_VERSION docs/v0.7
          git commit -m 'Finalize KID Intro Guide v0.7'
          git push origin HEAD:v0.7-publish
