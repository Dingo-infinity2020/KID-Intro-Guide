name: Build KID guide

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.tex'
      - 'scripts/build_latest.sh'
      - 'Makefile'
      - '.github/workflows/build-guide.yml'
  pull_request:
    paths:
      - 'docs/**/*.tex'
      - 'scripts/build_latest.sh'
      - 'Makefile'
      - '.github/workflows/build-guide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile current PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.2
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.2.tex"
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.2.tex"

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: KID-Intro-Guide-v0.2
          path: docs/v0.2/KID入门讲义_v0.2.pdf
          if-no-files-found: error
