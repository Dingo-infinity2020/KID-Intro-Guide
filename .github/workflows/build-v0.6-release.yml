name: Build and commit KID guide v0.6

'on':
  push:
    branches: [v0.6-publish]
    paths:
      - '.github/workflows/build-v0.6-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v0.6 reviewed LaTeX source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/v0.6
          cp 'docs/v0.5/KID入门讲义_v0.5.tex' 'docs/v0.6/KID入门讲义_v0.6.tex'
          base64 -d bootstrap/v0.6/tex.patch.gz.b64 | gzip -dc > /tmp/tex.patch
          patch 'docs/v0.6/KID入门讲义_v0.6.tex' < /tmp/tex.patch
          grep -q '光学响应、噪声与 NEP' 'docs/v0.6/KID入门讲义_v0.6.tex'
          grep -q 'Version 0.6' 'docs/v0.6/KID入门讲义_v0.6.tex'

      - name: Compile v0.6 PDF
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.6
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.6.tex'
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.6.tex'
            test -s 'KID入门讲义_v0.6.pdf'
            grep -q 'Output written on KID入门讲义_v0.6.pdf (67 pages)' 'KID入门讲义_v0.6.log'

      - name: Commit built guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v0.6/KID入门讲义_v0.6.tex docs/v0.6/KID入门讲义_v0.6.pdf
          git commit -m 'Build KID Intro Guide v0.6'
          git push origin HEAD:v0.6-publish
