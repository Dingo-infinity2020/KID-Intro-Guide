name: Build v0.10 Step 4-B superconducting-response pedagogy

on:
  push:
    branches: [v0.10-step4-formulas]
    paths:
      - '.github/workflows/build-v0.10-step4b.yml'

permissions:
  contents: write

jobs:
  build-step4b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Step 4 branch
        uses: actions/checkout@v4
        with:
          ref: v0.10-step4-formulas
          fetch-depth: 0

      - name: Normalize Step 4-B Markdown anchors and apply transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('editorial/v0.10/step4/step4b_formula_transform.py')
          s = p.read_text(encoding='utf-8')

          # The Markdown chapter uses compact numbered headings rather than the TeX section titles.
          s = s.replace('"## 5.4 Mattis"', '"## 2. Mattis–Bardeen 在做什么？"')
          s = s.replace('"## 5.6 从体电导"', '"## 4. 从 $\\\\sigma$ 到表面阻抗"')
          s = s.replace('"## 5.7 终于闭环"', '"## 5. 从 $\\\\sigma_2$ 到 kinetic inductance"')
          s = s.replace('"## 5.8 从 $\\\\sigma_1$ 到 $Q_i$"', '"## 6. 从 $\\\\sigma_1$ 到 $Q_i$"')

          # sigma_1 average-power relation is written inline in Markdown, not as its own display.
          helper = r'''
          def insert_after_md_literal(text: str, scope: str, anchor: str, addition: str, sentinel: str) -> str:
              if sentinel in text:
                  return text
              s = text.find(scope)
              if s < 0:
                  raise SystemExit(f"Missing Markdown literal scope: {scope}")
              a = text.find(anchor, s)
              if a < 0:
                  raise SystemExit(f"Missing Markdown literal anchor after {scope}: {anchor}")
              end = text.find("\n", a)
              if end < 0:
                  end = len(text)
              return text[:end] + "\n\n" + addition.rstrip() + "\n" + text[end:]
          '''
          needle = '\ndef tex_guide('
          if 'def insert_after_md_literal' not in s:
              if needle not in s:
                  raise SystemExit('Could not locate helper insertion point')
              s = s.replace(needle, '\n' + helper.strip('\n') + needle, 1)

          block_start = s.find('# 8) Average dissipated power density')
          block_end = s.find('# 9) Mattis--Bardeen pair of integrals', block_start)
          if block_start < 0 or block_end < 0:
              raise SystemExit('Could not locate Step 4-B sigma1 Markdown block')
          block = s[block_start:block_end]
          block = block.replace('md = insert_after_md_display(', 'md = insert_after_md_literal(', 1)
          block = block.replace('"### $\\\\sigma_1$：为什么它代表损耗"', '"# 第 5 章：复电导与 Mattis"', 1)

          # Only the Markdown inline expression uses \tfrac12; the TeX displayed equation uses \frac12.
          md_pos = block.find('md = insert_after_md_literal(')
          if md_pos < 0:
              raise SystemExit('Could not locate normalized sigma1 Markdown call')
          head, tail = block[:md_pos], block[md_pos:]
          tail = tail.replace('r"\\langle p\\rangle=\\frac12\\sigma_1|E_0|^2"', 'r"\\langle p\\rangle=\\tfrac12\\sigma_1|E_0|^2"', 1)
          block = head + tail
          s = s[:block_start] + block + s[block_end:]

          p.write_text(s, encoding='utf-8')
          PY
          python3 editorial/v0.10/step4/step4b_formula_transform.py

      - name: Compile and audit Step 4-B PDF
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd editorial/v0.10/step4
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10_step4.tex'
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10_step4.tex'
            test -s 'KID入门讲义_v0.10_step4.pdf'

            python3 - <<'PY'
            from pathlib import Path
            import re

            log = Path('KID入门讲义_v0.10_step4.log').read_text(encoding='utf-8', errors='replace')
            pages_m = re.findall(r'Output written on .*?\((\d+) pages', log)
            if not pages_m:
                raise SystemExit('Could not determine Step 4-B PDF page count')
            pages = int(pages_m[-1])
            over = len(re.findall(r'Overfull \\hbox', log))
            bookmark_warning = 'Token not allowed in a PDF string' in log

            audit_path = Path('STEP4B_FORMULA_AUDIT.md')
            audit = audit_path.read_text(encoding='utf-8')
            audit += (
                '\n## Compilation / layout gate\n\n'
                f'- PDF pages: **{pages}**\n'
                f'- Overfull hbox count: **{over}**\n'
                f'- Hyperref math-token bookmark warning: **{"YES" if bookmark_warning else "NO"}**\n'
                f'- Step 4-B build gate: **{"PASS" if over == 0 and not bookmark_warning else "FAIL"}**\n'
            )
            audit_path.write_text(audit, encoding='utf-8')

            if pages < 136:
                raise SystemExit(f'Unexpectedly short Step 4-B PDF: {pages} pages')
            if over:
                raise SystemExit(f'Step 4-B introduced {over} Overfull hbox warnings')
            if bookmark_warning:
                raise SystemExit('Step 4-B reintroduced PDF bookmark math warnings')
            print(f'Step 4-B gate PASS: {pages} pages')
            PY

      - name: Commit Step 4-B checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ROOT='editorial/v0.10/step4'
          rm -f "$ROOT"/*.aux "$ROOT"/*.log "$ROOT"/*.out "$ROOT"/*.toc "$ROOT"/*.orig "$ROOT"/*.rej
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          git commit -m 'Add v0.10 Step 4-B superconducting-response formula pedagogy'
          git push origin HEAD:v0.10-step4-formulas
