name: Build v0.10 release candidate

on:
  push:
    branches: [v0.10-publish]
    paths:
      - '.github/workflows/build-v0.10-release.yml'

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean publish branch
        uses: actions/checkout@v4
        with:
          ref: v0.10-publish
          fetch-depth: 0

      - name: Assemble v0.10 release tree from audited Step 4 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v0.10-step4-formulas:refs/remotes/origin/v0.10-step4-formulas
          SRC='origin/v0.10-step4-formulas'
          OUT='docs/v0.10'
          rm -rf "$OUT"
          mkdir -p "$OUT/examples" "$OUT/templates"

          git show "$SRC:editorial/v0.10/step4/KID入门讲义_v0.10_step4.tex" > "$OUT/KID入门讲义_v0.10.tex"
          git show "$SRC:editorial/v0.10/step4/KID入门讲义_v0.10_step4.md" > "$OUT/KID入门讲义_v0.10.md"

          # Preserve v0.9 engineering-validation examples/templates, then overlay
          # the audited canonical examples added/refreshed during v0.10.
          cp -a docs/v0.9/examples/. "$OUT/examples/"
          cp -a docs/v0.9/templates/. "$OUT/templates/"
          while IFS= read -r p; do
            rel="${p#examples/}"
            git show "$SRC:$p" > "$OUT/examples/$rel"
          done < <(git ls-tree -r --name-only "$SRC" examples | grep '^examples/.*\.py$')

          python3 - <<'PY'
          from pathlib import Path

          out = Path('docs/v0.10')
          tex = out / 'KID入门讲义_v0.10.tex'
          md = out / 'KID入门讲义_v0.10.md'

          # Freeze reader-facing titles as a real release rather than an editorial preview.
          t = tex.read_text(encoding='utf-8')
          replacements = {
              'KID入门讲义 v0.10 Step 4 Formula Pedagogy Preview': 'KID入门讲义 v0.10',
              'KID 入门讲义 v0.10 Step 4 Formula Pedagogy Preview': 'KID 入门讲义 v0.10',
              'Version 0.10 Step 4 Formula Pedagogy Preview · 2026-09-10': 'Version 0.10 · 2026-09-10',
          }
          for old, new in replacements.items():
              t = t.replace(old, new)
          tex.write_text(t, encoding='utf-8')

          m = md.read_text(encoding='utf-8')
          m = m.replace('# KID 入门讲义 v0.10 — Step 4 核心公式教学化预览', '# KID 入门讲义 v0.10')
          m = m.replace('**版本：v0.10 Step 4 Formula Pedagogy Preview · 2026-09-10**', '**版本：v0.10 · 2026-09-10**')
          md.write_text(m, encoding='utf-8')

          # One preserved v0.8 teaching script carried a stale banner only; make it version-neutral.
          cap = out / 'examples' / 'capstone_chain_demo.py'
          if cap.exists():
              cs = cap.read_text(encoding='utf-8')
              cs = cs.replace('=== KID v0.8 capstone chain ===', '=== KID capstone chain ===')
              cap.write_text(cs, encoding='utf-8')

          # Public-release guard: development labels must not leak into the guide itself.
          bad = []
          for p in (tex, md):
              s = p.read_text(encoding='utf-8')
              for pat in ('Formula Pedagogy Preview', 'Step 4 Formula', '核心公式教学化预览'):
                  if pat in s:
                      bad.append(f'{p}: {pat}')
          if bad:
              raise SystemExit('Release-label leak:\n' + '\n'.join(bad))
          if cap.exists() and 'KID v0.8 capstone chain' in cap.read_text(encoding='utf-8'):
              raise SystemExit('Stale capstone release banner remains')

          # Root README: move the public pointer from v0.9 to v0.10 without
          # erasing the v0.9 historical notes.
          rp = Path('README.md')
          r = rp.read_text(encoding='utf-8')
          r = r.replace('> 当前版本：**v0.9（2026-09-08）** · 121 页', '> 当前版本：**v0.10（2026-09-10）** · 144 页')
          r = r.replace('[PDF 阅读版](docs/v0.9/KID入门讲义_v0.9.pdf)', '[PDF 阅读版](docs/v0.10/KID入门讲义_v0.10.pdf)')
          r = r.replace('[LaTeX 权威排版源文件](docs/v0.9/KID入门讲义_v0.9.tex)', '[LaTeX 权威排版源文件](docs/v0.10/KID入门讲义_v0.10.tex)')
          r = r.replace('[Markdown 内容源文件](docs/v0.9/KID入门讲义_v0.9.md)', '[Markdown 内容源文件](docs/v0.10/KID入门讲义_v0.10.md)')
          r = r.replace('[v0.9 修改记录](docs/v0.9/CHANGELOG.md)', '[v0.10 修改记录](docs/v0.10/CHANGELOG.md)')
          r = r.replace('[v0.9 Python 示例](docs/v0.9/examples/)', '[v0.10 Python 示例](docs/v0.10/examples/)')
          r = r.replace('[v0.9 项目验证模板](docs/v0.9/templates/)', '[v0.10 项目验证模板](docs/v0.10/templates/)')
          v010 = '''\n### v0.10\n- 以完全新手可读为目标重整全书入口、章节导航和术语速查，不再假设读者已经熟悉 KID/超导专用语言；\n- 对核心关系增加 43 组“数学上—物理上—工程上—适用条件”公式解读，把公式从结论改造成可理解、可检查的因果链；\n- 强化超导基础、Mattis–Bardeen、谐振器/IQ、responsivity/NEP 与 LEKID 电磁设计之间的跨章连接；\n- 统一 $N_{\\rm qp}$ / $n_{\\rm qp}$、$\\Delta$ / $\\Delta\\nu$、$P_{\\rm inc}$ / $P_{\\rm abs}$ / $P_{\\rm read}$、复数单位与 PSD/ASD 等易混符号；\n- 发布前执行严格 XeLaTeX、交叉引用、缺字、Python 示例和 PDF 渲染/字体嵌入门禁。\n'''
          marker = '\n## 总体学习路线\n'
          if '### v0.10\n' not in r:
              if marker not in r:
                  raise SystemExit('README insertion marker missing')
              r = r.replace(marker, v010 + marker, 1)
          rp.write_text(r, encoding='utf-8')

          Path('LATEST_VERSION').write_text('v0.10\n', encoding='utf-8')

          changelog = '''# KID 入门讲义 v0.10 — 修改记录\n\n发布日期：2026-09-10\n\nv0.10 是一次面向“真正第一次接触 KID 的读者”的全书教学化重构，而不是简单增加新章节。它保留 v0.9 的项目验证闭环，同时系统降低前置知识门槛并提高公式、术语和工程结论的可追溯性。\n\n## 主要变化\n\n1. **新手入口重做**：补强第 0 章、全书阅读路线、符号/缩写/术语速查和每章导航，让读者先建立“光 → 超导状态 → 谐振器 → 微波读出”的主链。\n2. **核心公式教学化**：共保留 43 组四层解释，统一回答“数学上是什么、物理上为什么、工程上怎么用、适用条件是什么”。\n3. **超导与材料链补强**：扩展 BCS 能隙、准粒子、热激发、复电导、薄膜表面阻抗、动能电感及其近似条件。\n4. **微波读出链补强**：强化 $Q_i/Q_c/Q_r$、notch、IQ circle、固定 tone 读出、frequency/dissipation response 与 fitting 的联系。\n5. **响应度与噪声链补强**：明确 responsivity、PSD/ASD、one-sided/two-sided 约定与 NEP 的输入功率定义。\n6. **LEKID 电磁设计教学化**：增加 fill factor、active volume、backshort、圆波导 cutoff、偏振选择性、耦合 $Q$、modal power closure 与 band-weighted absorption 的解释。\n7. **公开教材一致性清理**：移除正文中的历史版本标签和私有项目措辞；统一 $N_{qp}$/$n_{qp}$、$\\Delta$/$\\Delta\\nu$、$P_{inc}$/$P_{abs}$/$P_{read}$ 与复数单位约定。\n8. **可执行示例**：保留 v0.9 项目验证示例，并加入/更新 resonator、responsivity、noise、waveguide 与 backshort 等 canonical examples。\n9. **严格发布门禁**：XeLaTeX 双编译、Overfull hbox、bookmark、undefined refs/citations、missing glyph、Python 示例实际执行、PDF 页面渲染和字体嵌入检查。\n\n## 兼容性\n\nv0.9 的 validation matrix、run manifest 与 pre-fabrication checklist 继续保留，v0.10 不改变它们作为工程证据模板的角色。\n'''
          (out / 'CHANGELOG.md').write_text(changelog, encoding='utf-8')

          readme = '''# KID 入门讲义 v0.10\n\n这是 v0.10 的冻结发布目录。\n\n- `KID入门讲义_v0.10.pdf`：正式阅读版\n- `KID入门讲义_v0.10.tex`：权威排版源文件\n- `KID入门讲义_v0.10.md`：便于检索、审阅和二次编辑的内容源文件\n- `examples/`：与正文配套的可执行 Python 示例\n- `templates/`：项目验证、仿真记录与加工前检查模板\n- `CHANGELOG.md`：本版本主要修改\n- `RELEASE_AUDIT.md`：发布门禁与可复现性记录\n\n本版本的核心目标是让完全新手也能沿“光 → 超导状态 → 谐振器 → 微波读出 → 灵敏度 → LEKID 工程设计”逐步进入 KID，同时保留足够严格的公式条件、仿真边界与验证方法。\n'''
          (out / 'README.md').write_text(readme, encoding='utf-8')

          ex = sorted(p.name for p in (out/'examples').glob('*.py'))
          exreadme = '# v0.10 Python 示例\n\n这些脚本是教学/验证用的最小可运行示例。发布 CI 会进行语法检查并在无图形界面环境中实际执行。\n\n' + ''.join(f'- `{x}`\n' for x in ex)
          (out/'examples'/'README.md').write_text(exreadme, encoding='utf-8')

          audit = '''# v0.10 Release Audit\n\n- Audited source branch: `v0.10-step4-formulas`\n- Audited source commit: `89dc3f942be0723e3c9865b8fcf7a6e7ac8c4ef2`\n- Step 4-E formula/editorial gate: **PASS**\n- Reader-facing four-layer formula guides: **43**\n- Historical development labels in public guide body: **0**\n- Known private-project markers in public guide body: **0**\n- Expected release PDF length: **144 pages**\n\nThe build, example, font and render gates below are filled by release CI.\n'''
          (out / 'RELEASE_AUDIT.md').write_text(audit, encoding='utf-8')
          print(f'Assembled release with {len(ex)} Python examples')
          PY

      - name: Test all v0.10 Python examples
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          python3 -m venv /tmp/kid-v010-venv
          /tmp/kid-v010-venv/bin/pip install -q --upgrade pip
          /tmp/kid-v010-venv/bin/pip install -q numpy scipy matplotlib pandas
          /tmp/kid-v010-venv/bin/python -m py_compile docs/v0.10/examples/*.py
          mkdir -p /tmp/kid-v010-example-runs
          for f in docs/v0.10/examples/*.py; do
            echo "RUN $f"
            (cd /tmp/kid-v010-example-runs && /tmp/kid-v010-venv/bin/python "$GITHUB_WORKSPACE/$f")
          done

      - name: Compile final v0.10 PDF and audit TeX log
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.10
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10.tex'
            xelatex -interaction=nonstopmode -halt-on-error 'KID入门讲义_v0.10.tex'
            test -s 'KID入门讲义_v0.10.pdf'
            python3 - <<'PY'
            from pathlib import Path
            import re
            log=Path('KID入门讲义_v0.10.log').read_text(encoding='utf-8',errors='replace')
            pages_m=re.findall(r'Output written on .*?\((\d+) pages',log)
            if not pages_m: raise SystemExit('Could not determine PDF page count')
            pages=int(pages_m[-1])
            over=len(re.findall(r'Overfull \\hbox',log))
            under=len(re.findall(r'Underfull \\hbox',log))
            bookmark='Token not allowed in a PDF string' in log
            undef_ref=bool(re.search(r'(There were undefined references|Reference .* undefined)',log))
            undef_cite=bool(re.search(r'Citation .* undefined',log))
            missing='Missing character:' in log
            if pages != 144: raise SystemExit(f'Expected 144 pages, got {pages}')
            if over: raise SystemExit(f'{over} Overfull hboxes remain')
            if bookmark: raise SystemExit('Bookmark math-token warning remains')
            if undef_ref: raise SystemExit('Undefined references remain')
            if undef_cite: raise SystemExit('Undefined citations remain')
            if missing: raise SystemExit('Missing-character warnings remain')
            p=Path('RELEASE_AUDIT.md')
            s=p.read_text(encoding='utf-8')
            s += f'''\n## XeLaTeX gate\n\n- PDF pages: **{pages}**\n- Overfull hbox: **{over}**\n- Underfull hbox (reported, non-fatal): **{under}**\n- Hyperref math-token warning: **NO**\n- Undefined references: **NO**\n- Undefined citations: **NO**\n- Missing characters: **NO**\n- XeLaTeX release gate: **PASS**\n'''
            p.write_text(s,encoding='utf-8')
            PY
            rm -f *.aux *.log *.out *.toc

      - name: Render/preflight final PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          /tmp/kid-v010-venv/bin/pip install -q pillow
          PDF='docs/v0.10/KID入门讲义_v0.10.pdf'
          mkdir -p /tmp/kid-v010-render
          pdftoppm -r 90 -png "$PDF" /tmp/kid-v010-render/page >/dev/null 2>&1
          pdfinfo "$PDF" > /tmp/kid-v010-pdfinfo.txt
          pdffonts "$PDF" > /tmp/kid-v010-pdffonts.txt
          pdftotext "$PDF" /tmp/kid-v010-text.txt
          /tmp/kid-v010-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np, re

          imgs=sorted(Path('/tmp/kid-v010-render').glob('page-*.png'))
          if len(imgs)!=144:
              raise SystemExit(f'Expected 144 rendered pages, got {len(imgs)}')
          sizes=[]; sparse=[]; dense=[]; border_bad=[]
          for i,p in enumerate(imgs,1):
              im=Image.open(p).convert('L')
              a=np.asarray(im)
              sizes.append(im.size)
              ink=(a<245)
              frac=float(ink.mean())
              if frac < 0.002: sparse.append(i)
              if frac > 0.45: dense.append((i,frac))
              b=np.concatenate([ink[:8,:].ravel(),ink[-8:,:].ravel(),ink[:,:8].ravel(),ink[:,-8:].ravel()])
              if float(b.mean()) > 0.002: border_bad.append((i,float(b.mean())))
          if len(set(sizes))!=1:
              raise SystemExit(f'Inconsistent page raster sizes: {set(sizes)}')
          if dense:
              raise SystemExit(f'Unexpectedly dense/corrupt-looking pages: {dense}')
          if border_bad:
              raise SystemExit(f'Ink touches extreme page border: {border_bad[:10]}')

          # pdffonts columns are: name, type, encoding, emb, sub, uni, object ID.
          # The type column can contain spaces (e.g. "CID Type 0C"), so parse
          # emb/sub/uni from the row tail rather than by a fixed split index.
          fonts=Path('/tmp/kid-v010-pdffonts.txt').read_text(encoding='utf-8',errors='replace').splitlines()
          not_embedded=[]
          unparsable=[]
          for line in fonts[2:]:
              if not line.strip():
                  continue
              m=re.search(r'\s+(yes|no)\s+(yes|no)\s+(yes|no)\s+\d+\s+\d+\s*$', line, re.I)
              if not m:
                  unparsable.append(line)
                  continue
              if m.group(1).lower()!='yes':
                  not_embedded.append(line)
          if unparsable:
              raise SystemExit('Could not parse pdffonts rows:\n'+'\n'.join(unparsable))
          if not_embedded:
              raise SystemExit('Non-embedded fonts detected:\n'+'\n'.join(not_embedded))

          text=Path('/tmp/kid-v010-text.txt').read_text(encoding='utf-8',errors='replace')
          if '\ufffd' in text:
              raise SystemExit('Unicode replacement character found in pdftotext output')
          if 'Step 4 Formula Pedagogy Preview' in text or '核心公式教学化预览' in text:
              raise SystemExit('Development release label leaked into PDF text')

          audit=Path('docs/v0.10/RELEASE_AUDIT.md')
          s=audit.read_text(encoding='utf-8')
          s += f'''\n## PDF render / font gate\n\n- Pages rendered by Poppler: **{len(imgs)} / 144**\n- Raster page size consistency: **PASS** ({sizes[0][0]}×{sizes[0][1]} px at 90 dpi)\n- Extreme-border ink/clipping heuristic: **PASS**\n- Corrupt/dense-page heuristic: **PASS**\n- Very sparse pages (reported for manual awareness, non-fatal): **{sparse}**\n- Fonts embedded: **PASS**\n- `pdftotext` replacement characters: **0**\n- Development label leak in PDF text: **0**\n- PDF render/preflight gate: **PASS**\n'''
          audit.write_text(s,encoding='utf-8')
          PY

      - name: Final release-tree guards and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < LATEST_VERSION)" = 'v0.10'
          test -s 'docs/v0.10/KID入门讲义_v0.10.pdf'
          test -s 'docs/v0.10/KID入门讲义_v0.10.tex'
          test -s 'docs/v0.10/KID入门讲义_v0.10.md'
          grep -q 'PDF render/preflight gate: \*\*PASS\*\*' docs/v0.10/RELEASE_AUDIT.md
          grep -q 'XeLaTeX release gate: \*\*PASS\*\*' docs/v0.10/RELEASE_AUDIT.md
          if grep -Eq 'Step 4 Formula Pedagogy Preview|核心公式教学化预览' docs/v0.10/KID入门讲义_v0.10.{tex,md}; then
            echo 'Development marker remains in final source' >&2; exit 1
          fi

          # One-off workflow should not enter the public release diff.
          rm -f .github/workflows/build-v0.10-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LATEST_VERSION docs/v0.10 .github/workflows/build-v0.10-release.yml
          git commit -m 'Prepare KID Intro Guide v0.10 release candidate'
          git push origin HEAD:v0.10-publish
