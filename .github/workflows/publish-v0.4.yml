name: Publish KID guide v0.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.4.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate v0.4 sources from reviewed patches
        run: |
          set -euo pipefail
          mkdir -p docs/v0.4
          cp "docs/v0.3/KID入门讲义_v0.3.tex" "docs/v0.4/KID入门讲义_v0.4.tex"
          cp "docs/v0.3/KID入门讲义_v0.3.md" "docs/v0.4/KID入门讲义_v0.4.md"
          patch "docs/v0.4/KID入门讲义_v0.4.tex" < .bootstrap/v0.4_tex.patch
          patch "docs/v0.4/KID入门讲义_v0.4.md" < .bootstrap/v0.4_md.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/v0.4/KID入门讲义_v0.4.md')
          s=p.read_text()
          s=s.replace('- v0.4：复电导、surface impedance 与 Mattis–Bardeen 的器件化理解\n','')
          s=s.replace('- v0.5：$Q_i/Q_c/Q_r$、notch resonator、IQ circle 与 fitting','- v0.5：$Q_i/Q_c/Q_r$、notch resonator、IQ circle、固定 tone 读出与实际 fitting')
          s=s.replace('- v0.8：映射到当前双偏振 150 GHz LEKID 项目与 Sonnet/CST 验证矩阵','- v0.8：映射到当前双偏振 150 GHz LEKID 项目与 Sonnet/CST 验证矩阵，并加入 Python 数值练习')
          ref='8. P. J. de Visser et al., “Generation-Recombination Noise: The Fundamental Sensitivity Limit for Kinetic Inductance Detectors,” *Journal of Low Temperature Physics*, 167, 335–340 (2012).'
          if 'D. C. Mattis' not in s:
              s=s.replace(ref, ref+'\n9. D. C. Mattis and J. Bardeen, “Theory of the Anomalous Skin Effect in Normal and Superconducting Metals,” *Physical Review*, 111, 412–417 (1958).')
          p.write_text(s)
          PY

      - name: Compile v0.4 PDF with XeLaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd docs/v0.4
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.4.tex"
            xelatex -interaction=nonstopmode -halt-on-error "KID入门讲义_v0.4.tex"

      - name: Publish v0.4 and remove bootstrap files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.4
          git rm .bootstrap/v0.4_tex.patch .bootstrap/v0.4_md.patch .github/workflows/publish-v0.4.yml
          git commit -m "Publish KID Intro Guide v0.4"
          git push
