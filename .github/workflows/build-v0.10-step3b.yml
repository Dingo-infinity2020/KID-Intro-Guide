\begin{intuitionbox}
本书会保留一些 KID 论文、微波测量和电磁仿真中极常见的英文词，例如 meander、notch、feedline、backshort 和 probe tone。第一次出现时给出中文含义，后文可能直接沿用英文，目的是让教材中的词与论文、VNA/EM 软件界面能够一一对应，而不是要求读者同时记两套术语。
\end{intuitionbox}

